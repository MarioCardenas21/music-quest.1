<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica Quest - Tu Viaje Musical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Intro Screen -->
        <section id="intro-screen" class="screen">
            <div class="title-logo">
                <h1>MUSICA<br>QUEST</h1>
                <p>EL VIAJE DEL RITMO</p>
            </div>
            <div class="start-prompt">
                <button id="start-btn">PRESS START</button>
            </div>
            <div class="legend">© 2024 RETRO SOUND SYSTEM</div>
        </section>

        <!-- Main Map Screen -->
        <section id="map-screen" class="screen hidden">
            <header class="hud">
                <div class="hud-item">
                    <button id="quest-info-btn">📜 MISIÓN</button>
                </div>
                <div class="hud-item">
                    <span>RANK:</span>
                    <span id="rank-name">INICIADO</span>
                </div>
                <div class="hud-item" id="hearts-container">
                    <!-- Hearts rendered here -->
                </div>
            </header>

            <main id="adventure-map">
                <div id="map-content">
                    <div id="character"></div>
                    <div id="path-container"></div>
                </div>
            </main>

            <footer class="controls">
                <div class="input-group">
                    <input type="text" id="song-input" placeholder="TÍTULO...">
                    <input type="text" id="artist-input" placeholder="ARTISTA...">
                    <button id="add-song-btn">AÑADIR</button>
                </div>
                <div class="action-buttons">
                    <button id="finish-quest-btn">TERMINAR BÚSQUEDA</button>
                </div>
            </footer>
        </section>

        <!-- Dialog Box -->
        <div id="dialog-box" class="hidden">
            <div id="dialog-text"></div>
            <span class="dialog-arrow">▼</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
