<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resumen de tu Viaje - Musica Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            padding: 40px;
            text-align: center;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 6px solid #fff;
            padding: 30px;
            box-shadow: 0 0 0 4px #000, 0 0 0 10px #fff;
        }
        h1 { color: #B87028; font-size: 24px; margin-bottom: 20px; }
        h2 { color: #80D010; font-size: 16px; margin-bottom: 40px; }
        .song-list { text-align: left; margin-bottom: 40px; }
        .song-item {
            border-bottom: 2px dashed #444;
            padding: 15px 0;
        }
        .song-goal { color: #80D010; font-size: 10px; margin-bottom: 5px; }
        .song-info { font-size: 12px; }
        .btns { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
        button {
            font-family: 'Press Start 2P', cursive;
            padding: 15px 25px;
            cursor: pointer;
            border: 4px solid #fff;
            background: #000;
            color: #fff;
            font-size: 12px;
        }
        button:hover { background: #fff; color: #000; }
        #download-btn { background-color: #007000; }
        #reset-btn { background-color: #E40058; }
        
        @media print {
            .btns { display: none; }
            body { background: #fff; color: #000; }
            .container { border: none; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DIARIO DE AVENTURA MUSICAL</h1>
        <h2 id="rank-display">RANGO: LEYENDA</h2>
        
        <div id="song-list" class="song-list">
            <!-- List filled by JS -->
        </div>

        <div class="btns">
            <button id="download-btn">DESCARGAR PDF (IMPRIMIR)</button>
            <button id="reset-btn">BORRAR Y NUEVO VIAJE</button>
        </div>
    </div>

    <script>
        const playlist = JSON.parse(localStorage.getItem('musicaQuest_playlist')) || [];
        const listEl = document.getElementById('song-list');
        
        if (playlist.length === 0) {
            window.location.href = 'index.html';
        }

        playlist.forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerHTML = `
                <div class="song-goal">RETO ${idx + 1}: ${s.goal}</div>
                <div class="song-info">${s.title.toUpperCase()} - ${s.artist.toUpperCase()}</div>
            `;
            listEl.appendChild(div);
        });

        document.getElementById('download-btn').onclick = () => {
            window.print();
        };

        document.getElementById('reset-btn').onclick = () => {
            if (confirm("¿BORRAR TODO Y EMPEZAR DE NUEVO?")) {
                localStorage.removeItem('musicaQuest_playlist');
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
